# 开发工具配置（black/isort/mypy/pylint）。
# 期A 清理（2026-08-28）：移除 [build-system]（无 setup.py）、[tool.coverage]（source=src 已删）、
# [tool.pytest.ini_options]（testpaths=src/tests 已删）——它们都指向已删除的 Phase4 src/ 脚手架。

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = "(?x)(^docs/|^build/|^dist/)"

[tool.pylint.messages_control]
disable = [
    "C0330", "C0326",  # Bad whitespace
    "R0913",           # Too many arguments
    "R0914",           # Too many local variables
    "R0915",           # Too many statements
    "C0114",           # Missing module docstring
    "C0115",           # Missing class docstring
    "C0116",           # Missing function docstring
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-attributes = 10
max-arguments = 8
