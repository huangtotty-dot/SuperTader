dual_channel:
  dual_channel:
    channel1:
      name: ice_point_reversal
      weight: 0.6
      min_score: 0.7
    channel2:
      name: breakout_follow
      weight: 0.4
      min_score: 0.6
  combined_score_threshold: 0.65
  can_build_when:
    market_confidence: 0.7
    signal_strength: 0.8
    no_risk_event: true
single_tier:
  add_position:
    trigger_depth: 2.0
    target_add_qty: 100
    max_add_times: 3
  reduce_position:
    trigger_profit: 2.0
    target_reduce_qty: 50
    min_position: 100
  stop_loss:
    max_drawdown: 3.0
    auto_cover: true
swing2pt:
  swing_bb_upper: 1.0
  swing_bb_lower: -0.8
  time_window_start: '10:00'
  time_window_end: '15:00'
  min_volume_ratio: 1.2
  min_price_change: 0.5
  ice_point_reversal:
    min_depth: 3
    max_depth: 8
    recovery_threshold: 0.5
  breakout_follow:
    box_height: 2.0
    breakout_threshold: 0.3
index_levels:
  index_levels:
    sh:
      very_strong: 3500
      strong: 3300
      neutral: 3100
      weak: 2900
      very_weak: 2700
    sz:
      very_strong: 12000
      strong: 11000
      neutral: 10000
      weak: 9000
      very_weak: 8000
  regime_detection:
    uptrend_ma_period: 20
    downtrend_ma_period: 20
    range_width_ratio: 0.1
  correlation:
    index_resonance_threshold: 0.7
    sector_resonance_threshold: 0.6
data_fetch:
  data_fetch:
    interval: 1
    timeout: 30
    retries: 3
    retry_delay: 1
    sources:
    - type: akshare
      priority: 1
      timeout: 10
    - type: local_cache
      priority: 2
      timeout: 5
  cache:
    enabled: true
    ttl: 300
    max_size: 10000
  snapshots:
    enabled: true
    interval: 60
    retention: 7
execution:
  execution:
    order_submit:
      timeout: 5
      retry_count: 2
    order_management:
      cancel_unfilled_timeout: 60
      max_pending_orders: 10
    fill_confirmation:
      timeout: 10
      required_confirmations: 1
  risk_control:
    single_order:
      max_loss_per_order: 1000
      max_qty_per_order: 500
    daily:
      max_loss: 5000
      max_trades: 50
    position:
      max_single_stock: 1000
      max_total: 5000
      max_cash_drawdown: 0.2
  circuit_breaker:
    enabled: true
    daily_loss_limit: 10000
    hourly_error_limit: 5
logging:
  logging:
    level: INFO
    outputs:
      console:
        enabled: true
        level: INFO
      file:
        enabled: true
        level: DEBUG
        path: logs
        max_size_mb: 100
        backup_count: 10
    format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
    modules:
      core.config_manager: DEBUG
      strategies.signal_engine: INFO
      execution.executor: INFO
  monitoring:
    enabled: true
    metrics_interval: 60
    metrics:
    - signal_count
    - order_count
    - execution_latency
    - cache_hit_rate
