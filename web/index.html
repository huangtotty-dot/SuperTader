<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>做T复盘决策看板</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-icon">📊</span>
    <span class="brand-title">做T决策看板</span>
    <span id="dateTag" class="date-tag"></span>
  </div>
  <div class="controls">
    <label class="lbl">日期
      <select id="dateSelect"></select>
    </label>
    <button id="refreshBtn" title="手动刷新">刷新</button>
    <label class="lbl toggle">
      <input type="checkbox" id="autoPoll" checked> 自动刷新
    </label>
    <label class="lbl toggle" title="买卖信号时播放急促报警音">
      <input type="checkbox" id="alertSound" checked> 报警音
    </label>
    <span id="liveTag" class="live-tag" style="display:none"></span>
    <span id="status" class="status"></span>
  </div>
</header>
<div id="alertBanner" class="alert-banner" style="display:none"></div>
<div id="quoteBar" class="quote-bar"></div>

<nav class="anchor-nav">
  <a href="#quotes">行情</a>
  <a href="#kpi">KPI</a>
  <a href="#chart">图表</a>
  <a href="#live">盘中实时</a>
  <a href="#positions">持仓</a>
  <a href="#settle">结算</a>
  <a href="#shadow">近阈·仓控</a>
  <a href="#position-builder">建仓</a>
  <a href="#add-watch">加仓</a>
  <a href="#stage-board">阶段看板</a>
</nav>

<main>
  <section class="section" id="quotes">
    <h2>持仓行情</h2>
    <div id="quotesBody" class="card"></div>
  </section>

  <section class="section" id="kpi">
    <h2>KPI 日快照</h2>
    <div id="kpiCards" class="kpi-grid"></div>
  </section>

  <section class="section" id="chart">
    <h2>图表分析</h2>
    <div class="chart-grid2">
      <div class="card">
        <div class="card-title">大盘跨日 S 打分</div>
        <div id="echMarket" class="echart"></div>
      </div>
      <div class="card">
        <div class="card-title">今日盘中 S 变化</div>
        <div id="echIntraday" class="echart"></div>
      </div>
      <div class="card">
        <div class="card-title">持仓成本趋势 <button class="mini-btn" id="calibBtn">✎ 校准成本</button></div>
        <div id="echCost" class="echart"></div>
        <div id="costMatrix" style="margin-top:10px"></div>
      </div>
      <div class="card">
        <div class="card-title">各股买卖信号数</div>
        <div id="echSignal" class="echart"></div>
      </div>
      <div class="card">
        <div class="card-title">K4 滚动胜率</div>
        <div id="echK4" class="echart"></div>
      </div>
    </div>
  </section>

  <section class="section" id="live">
    <h2>盘中实时</h2>
    <div id="liveBody">
      <div class="empty">非今日日期或尚无盘中数据</div>
    </div>
  </section>

  <section class="section" id="positions">
    <h2>持仓对照（当前 vs 快照）</h2>
    <div id="positionsBody"></div>
  </section>

  <section class="section" id="settle">
    <h2>盘中信号结算</h2>
    <div id="settleBody"></div>
  </section>

  <section class="section" id="shadow">
    <h2>shadow 近阈 · 仓控与推送</h2>
    <div id="shadowBody"></div>
  </section>

  <section class="section" id="position-builder">
    <h2>建仓信号扫描</h2>
    <div id="pbBody"></div>
  </section>

  <section class="section" id="add-watch">
    <h2>加仓观察（回踩支撑）</h2>
    <div id="addWatchBody"></div>
  </section>

  <section class="section" id="stage-board">
    <h2>系统阶段看板</h2>
    <div id="stageBoardBody"></div>
  </section>
</main>

<!-- 成本校准 modal -->
<div id="calibModal" class="modal-mask" style="display:none">
  <div class="modal">
    <div class="modal-title">校准持仓成本 <span class="cell-dim" id="calibDate"></span>
      <button class="mini-btn" id="calibClose">×</button>
    </div>
    <div class="modal-body">
      <table id="calibTable">
        <thead><tr><th>股票</th><th class="num">快照成本</th><th class="num">校准成本</th><th>来源</th></tr></thead>
        <tbody></tbody>
      </table>
      <p class="cell-dim" style="font-size:11px">填券商持仓页显示的真实成本，保存后成本曲线将优先使用校准值（✎ 标注）。留空表示该股不校准。</p>
    </div>
    <div class="modal-foot">
      <button class="mini-btn primary" id="calibSave">保存校准</button>
    </div>
  </div>
</div>

<footer class="footer">做T实盘系统 · 决策看板 · 数据只读</footer>

<script src="vendor/echarts.min.js"></script>
<script src="app.js"></script>
</body>
</html>
