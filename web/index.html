<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>做T复盘决策看板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1e88e5;
            --success: #43a047;
            --danger: #e53935;
            --warning: #fb8c00;
            --info: #00acc1;
            --bg-dark: #0d1117;
            --bg-card: #161b22;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --border: #30363d;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            overflow: hidden;
        }

        .app-layout {
            display: flex;
            width: 100%;
            height: 100%;
            flex-direction: column;
        }

        /* 导航栏 */
        .navbar {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 0;
            display: flex;
            align-items: center;
            gap: 4px;
            overflow-x: auto;
            flex-shrink: 0;
            height: 48px;
        }

        .nav-item {
            padding: 12px 18px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
            white-space: nowrap;
        }

        .nav-item:hover {
            color: var(--text-primary);
            background: rgba(30, 136, 229, 0.1);
        }

        .nav-item.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        /* 内容区域 */
        .content-area {
            flex: 1;
            overflow: auto;
            background: var(--bg-dark);
        }

        .tab-content {
            display: none;
            width: 100%;
            height: 100%;
        }

        .tab-content.active {
            display: block;
        }

        /* 加载动画 */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            color: var(--text-secondary);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* iframe 样式 */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: var(--bg-dark);
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <div class="navbar" id="navbar">
            <div class="nav-item active" data-tab="auction">📊 竞价诊断</div>
            <div class="nav-item" data-tab="dashboard">📈 复盘看板</div>
            <div class="nav-item" data-tab="backtest">🔍 回测分析</div>
            <div class="nav-item" data-tab="settings">⚙️ 设置</div>
        </div>

        <div class="content-area">
            <!-- 竞价诊断 -->
            <div class="tab-content active" id="auction-tab">
                <iframe src="auction_board.html"></iframe>
            </div>

            <!-- 其他页面占位 -->
            <div class="tab-content" id="dashboard-tab">
                <div class="loading">
                    <div class="spinner"></div>
                    <span>加载复盘看板...</span>
                </div>
            </div>

            <div class="tab-content" id="backtest-tab">
                <div class="loading">
                    <div class="spinner"></div>
                    <span>加载回测分析...</span>
                </div>
            </div>

            <div class="tab-content" id="settings-tab">
                <div class="loading">
                    <div class="spinner"></div>
                    <span>加载设置...</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 简单的标签页切换逻辑
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function() {
                const tab = this.getAttribute('data-tab');

                // 更新导航选中状态
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                this.classList.add('active');

                // 更新内容区域
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                document.getElementById(tab + '-tab').classList.add('active');
            });
        });
    </script>
</body>
</html>
