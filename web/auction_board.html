<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>集合竞价诊断面板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #f4f6fa;
            --bg-soft: #eaeef4;
            --bg-card: #ffffff;
            --border: #d3d9e3;
            --border-soft: #e4e8ef;
            --text: #1f2937;
            --text-dim: #6b7280;
            --accent: #e8531f;
            --red: #e8531f;
            --green: #229652;
            --gray: #6b7280;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background-color: var(--bg);
            background-image:
                radial-gradient(900px 520px at 12% -10%, rgba(232, 83, 31, .06), transparent 60%),
                radial-gradient(820px 620px at 108% 112%, rgba(80, 120, 190, .05), transparent 55%);
            background-attachment: fixed;
            color: var(--text);
            line-height: 1.6;
            padding: 16px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 头部 */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 14px;
            border-bottom: 2px solid var(--border-soft);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-title h2 {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent);
        }

        .header-subtitle {
            font-size: 11px;
            color: var(--text-dim);
        }

        .header-time {
            font-size: 12px;
            color: var(--text-dim);
        }

        /* 摘要卡片 */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 22px;
        }

        .summary-card {
            background: var(--bg-card);
            border: 1px solid var(--border-soft);
            border-radius: 10px;
            padding: 14px;
            text-align: center;
            box-shadow: 0 1px 3px rgba(31, 41, 55, .05);
            transition: all .2s ease;
        }

        .summary-card:hover {
            border-color: rgba(232, 83, 31, .4);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(232, 83, 31, .08);
        }

        .summary-label {
            font-size: 11px;
            color: var(--text-dim);
            letter-spacing: .5px;
            margin-bottom: 6px;
        }

        .summary-value {
            font-size: 24px;
            font-weight: 700;
        }

        .summary-card.up .summary-value { color: var(--red); }
        .summary-card.down .summary-value { color: var(--green); }
        .summary-card.neutral .summary-value { color: var(--gray); }

        /* 区块标题 */
        .section {
            margin-bottom: 26px;
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(232, 83, 31, .35);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 15px;
            background: var(--accent);
            border-radius: 2px;
        }

        /* 大盘竞价 */
        .index-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 12px;
        }

        .index-card {
            background: var(--bg-card);
            border: 1px solid var(--border-soft);
            border-radius: 8px;
            padding: 14px;
            text-align: center;
            box-shadow: 0 1px 3px rgba(31, 41, 55, .05);
        }

        .index-card-name {
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        .index-card-gap {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .index-card-gap.up { color: var(--red); }
        .index-card-gap.down { color: var(--green); }

        .index-card-level {
            font-size: 11px;
            color: var(--text-dim);
            background: var(--bg-soft);
            padding: 3px 8px;
            border-radius: 4px;
            display: inline-block;
        }

        .market-mood {
            background: var(--bg-card);
            border: 1px solid var(--border-soft);
            border-radius: 8px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 1px 3px rgba(31, 41, 55, .05);
        }

        .mood-label {
            font-size: 12px;
            color: var(--text-dim);
        }

        .mood-value {
            font-size: 18px;
            font-weight: 700;
        }

        .mood-value.up { color: var(--red); }
        .mood-value.down { color: var(--green); }
        .mood-value.neutral { color: var(--gray); }

        /* 持仓竞价一览 */
        .holdings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 14px;
        }

        .holding-card {
            background: var(--bg-card);
            border: 1px solid var(--border-soft);
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 1px 3px rgba(31, 41, 55, .05);
            position: relative;
            transition: all .2s ease;
        }

        .holding-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            border-radius: 10px 10px 0 0;
        }

        .holding-card.bullish::before {
            background: linear-gradient(90deg, var(--red), rgba(232, 83, 31, .25));
        }

        .holding-card.bearish::before {
            background: linear-gradient(90deg, var(--green), rgba(34, 150, 82, .25));
        }

        .holding-card.neutral::before {
            background: linear-gradient(90deg, var(--gray), rgba(107, 114, 128, .25));
        }

        .holding-card:hover {
            border-color: rgba(232, 83, 31, .35);
            box-shadow: 0 6px 16px rgba(31, 41, 55, .08);
        }

        .holding-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .holding-code {
            font-size: 11px;
            color: var(--text-dim);
            font-weight: 600;
            letter-spacing: .5px;
        }

        .holding-name {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            margin: 2px 0 0;
        }

        .holding-gap {
            font-size: 20px;
            font-weight: 700;
        }

        .holding-gap.up { color: var(--red); }
        .holding-gap.down { color: var(--green); }
        .holding-gap.flat { color: var(--gray); }

        .holding-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-dim);
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-soft);
        }

        .holding-trend {
            background: rgba(232, 83, 31, .08);
            color: var(--accent);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .holding-linkage {
            background: var(--bg);
            border: 1px solid var(--border-soft);
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 12px;
        }

        .linkage-risk {
            font-weight: 700;
            margin-bottom: 4px;
        }

        .linkage-risk.high-risk { color: var(--red); }
        .linkage-risk.opportunity { color: var(--green); }
        .linkage-risk.plain { color: var(--text); }

        .linkage-detail {
            font-size: 11px;
            color: var(--text-dim);
        }

        .holding-suggestion {
            background: rgba(232, 83, 31, .05);
            border-left: 3px solid var(--accent);
            border-radius: 4px;
            padding: 10px 12px;
            margin-bottom: 10px;
        }

        .suggestion-title {
            font-size: 10px;
            color: var(--text-dim);
            letter-spacing: .5px;
            margin-bottom: 4px;
        }

        .suggestion-text {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            line-height: 1.5;
        }

        .holding-confidence {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
        }

        .confidence-label {
            color: var(--text-dim);
        }

        .confidence-value {
            background: rgba(232, 83, 31, .1);
            color: var(--accent);
            padding: 3px 10px;
            border-radius: 4px;
            font-weight: 600;
        }

        /* 风险提示 */
        .risk-section {
            background: var(--bg-card);
            border: 1px solid var(--border-soft);
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 1px 3px rgba(31, 41, 55, .05);
        }

        .risk-alert {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 12px;
            background: var(--bg);
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .risk-alert:last-child {
            margin-bottom: 0;
        }

        .risk-icon {
            font-size: 17px;
            flex-shrink: 0;
        }

        /* 加载 / 无数据 */
        .no-data {
            background: var(--bg-card);
            border: 1px dashed var(--border);
            border-radius: 10px;
            padding: 40px 20px;
            text-align: center;
            color: var(--text-dim);
        }

        .no-data-icon {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .no-data-text {
            font-size: 14px;
            margin-bottom: 6px;
            color: var(--text);
        }

        .no-data-hint {
            font-size: 12px;
            color: var(--text-dim);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-dim);
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin .8s linear infinite;
            margin-right: 8px;
            vertical-align: -3px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .fade-in {
            animation: fadeIn .3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .container {
                padding: 0;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .summary-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .holdings-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <div class="header-title">
                <h2>📊 竞价诊断</h2>
                <span class="header-subtitle">做T猎手决策看板</span>
            </div>
            <div class="header-time" id="current-time">加载中...</div>
        </div>

        <!-- 摘要卡片 -->
        <div class="summary-grid" id="summary-grid">
            <!-- 动态生成 -->
        </div>

        <!-- 大盘竞价 -->
        <div class="section" id="index-section" style="display:none;">
            <div class="section-title">🌐 大盘竞价</div>
            <div class="index-cards" id="index-cards">
                <!-- 动态生成 -->
            </div>
            <div class="market-mood">
                <span class="mood-label">市场情绪</span>
                <span class="mood-value" id="mood-value">中性</span>
            </div>
        </div>

        <!-- 持仓竞价一览 -->
        <div class="section">
            <div class="section-title">📈 持仓竞价一览</div>
            <div class="holdings-grid" id="holdings-grid">
                <!-- 动态生成 -->
            </div>
        </div>

        <!-- 风险提示 -->
        <div class="risk-section" id="risk-section" style="display:none;">
            <div class="section-title">⚡ 风险提示</div>
            <div id="risk-alerts-container">
                <!-- 动态生成 -->
            </div>
        </div>

        <!-- 加载状态 -->
        <div id="loading-state" style="display:none;">
            <div class="loading">
                <span class="spinner"></span>正在加载诊断数据...
            </div>
        </div>

        <!-- 无数据提示 -->
        <div id="no-data-state" style="display:none;">
            <div class="no-data">
                <div class="no-data-icon">📭</div>
                <div class="no-data-text">暂无竞价诊断数据</div>
                <div class="no-data-hint">请等待 9:25 后获取今日竞价信息</div>
            </div>
        </div>
    </div>

    <script>
        // 实时时钟
        function updateClock() {
            const now = new Date();
            const p = n => String(n).padStart(2, '0');
            document.getElementById('current-time').textContent =
                `${p(now.getHours())}:${p(now.getMinutes())}:${p(now.getSeconds())}`;
        }
        updateClock();
        setInterval(updateClock, 1000);

        // 颜色映射（A股：红涨绿跌）
        function getGapClass(gap) {
            if (gap > 0.5) return 'up';
            if (gap < -0.5) return 'down';
            return 'flat';
        }

        function getGapSign(gap) {
            return gap > 0 ? `+${gap.toFixed(2)}%` : `${gap.toFixed(2)}%`;
        }

        // 构建摘要卡片（高开/平开/低开/策略建议）
        function buildSummaryCards(report) {
            const grid = document.getElementById('summary-grid');
            grid.innerHTML = '';

            const cards = [
                { label: '高开', value: report.bullish_count, cls: report.bullish_count > 0 ? 'up' : 'neutral' },
                { label: '平开', value: report.neutral_count, cls: 'neutral' },
                { label: '低开', value: report.bearish_count, cls: report.bearish_count > 0 ? 'down' : 'neutral' },
                { label: '策略', value: report.suggested_action,
                  cls: report.suggested_action === '进攻' ? 'up' : (report.suggested_action === '回避' ? 'down' : 'neutral') }
            ];

            cards.forEach(card => {
                const html = `
                    <div class="summary-card ${card.cls} fade-in">
                        <div class="summary-label">${card.label}</div>
                        <div class="summary-value">${card.value || '—'}</div>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', html);
            });
        }

        // 构建大盘竞价（指数卡片 + 市场情绪）；无指数数据时隐藏整块
        function buildIndexCards(report) {
            const section = document.getElementById('index-section');
            const idxList = report.index_analysis || [];

            if (!idxList.length) {
                section.style.display = 'none';
                return;
            }

            const grid = document.getElementById('index-cards');
            grid.innerHTML = '';
            idxList.forEach(idx => {
                const gapCls = getGapClass(idx.gap_pct);
                const html = `
                    <div class="index-card fade-in">
                        <div class="index-card-name">${idx.name || idx.code}</div>
                        <div class="index-card-gap ${gapCls}">${getGapSign(idx.gap_pct)}</div>
                        <div><span class="index-card-level">${idx.gap_level}</span></div>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', html);
            });

            const moodEl = document.getElementById('mood-value');
            const mood = report.market_mood || '中性';
            moodEl.textContent = mood;
            moodEl.className = 'mood-value ' + (mood === '偏多' ? 'up' : mood === '偏空' ? 'down' : 'neutral');

            section.style.display = 'block';
        }

        // 构建持仓竞价一览卡片
        function buildHoldingCards(holdings) {
            const grid = document.getElementById('holdings-grid');
            grid.innerHTML = '';

            if (!holdings || holdings.length === 0) return;

            holdings.forEach(h => {
                const cardClass = h.gap_pct > 0.5 ? 'bullish' : (h.gap_pct < -0.5 ? 'bearish' : 'neutral');
                const gapCls = getGapClass(h.gap_pct);

                // 联动判定（高危/机会/普通）
                const riskTxt = [h.risk_tag, h.linkage_label].filter(Boolean).join(' ');
                let linkCls = 'plain';
                if ((h.risk_tag || '').includes('高危')) linkCls = 'high-risk';
                else if ((h.risk_tag || '').includes('机会')) linkCls = 'opportunity';
                const linkHtml = riskTxt
                    ? `<div class="linkage-risk ${linkCls}">${riskTxt}</div>` : '';

                const ydayTxt = h.yesterday_label === '横盘'
                    ? '昨日横盘'
                    : `昨日${h.yesterday_label || '—'}(${h.yesterday_change_pct == null ? '—' : h.yesterday_change_pct.toFixed(2) + '%'})`;
                const vsIdx = h.vs_index ? ` · ${h.vs_index}` : '';

                const html = `
                    <div class="holding-card ${cardClass} fade-in">
                        <div class="holding-header">
                            <div>
                                <div class="holding-code">${h.code}</div>
                                <div class="holding-name">${h.name || h.code}</div>
                            </div>
                            <div class="holding-gap ${gapCls}">${getGapSign(h.gap_pct)}</div>
                        </div>

                        <div class="holding-meta">
                            <span>${h.gap_level}</span>
                            <span class="holding-trend">${h.trend_shape || '—'}</span>
                        </div>

                        <div class="holding-linkage">
                            ${linkHtml}
                            <div class="linkage-detail">${ydayTxt}${vsIdx}</div>
                        </div>

                        <div class="holding-suggestion">
                            <div class="suggestion-title">做T建议</div>
                            <div class="suggestion-text">${h.suggestion || '—'}</div>
                        </div>

                        <div class="holding-confidence">
                            <span class="confidence-label">置信度</span>
                            <span class="confidence-value">${h.confidence || '—'}</span>
                        </div>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', html);
            });
        }

        // 构建风险提示；无风险时隐藏
        function buildRiskAlerts(report) {
            const section = document.getElementById('risk-section');
            const container = document.getElementById('risk-alerts-container');
            const alerts = report.risk_alerts || [];

            if (!alerts.length) {
                section.style.display = 'none';
                return;
            }

            section.style.display = 'block';
            container.innerHTML = '';
            alerts.forEach(alert => {
                const icon = String(alert).includes('⚠️') ? '⚠️' : (String(alert).includes('💪') ? '💪' : '·');
                const html = `
                    <div class="risk-alert fade-in">
                        <span class="risk-icon">${icon}</span>
                        <span>${alert}</span>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', html);
            });
        }

        // 嵌入式场景：本面板被 GUI 主页面 iframe 承载时，iframe 内没有 pywebview.api（仅在顶层注入），
        // 通过 postMessage 请求父页面代为调用 get_auction_diagnosis() 并把结果传回。
        function requestReportFromParent() {
            return new Promise((resolve) => {
                if (!window.parent || window.parent === window) { resolve(null); return; }
                let done = false;
                const finish = (report) => {
                    if (done) return;
                    done = true;
                    window.removeEventListener('message', onMsg);
                    clearTimeout(timer);
                    resolve(report);
                };
                const onMsg = (e) => {
                    if (e.data && e.data.type === 'auction-response') finish(e.data.report || null);
                };
                const timer = setTimeout(() => finish(null), 8000);
                window.addEventListener('message', onMsg);
                window.parent.postMessage({ type: 'auction-request' }, '*');
            });
        }

        // 加载并展示数据
        async function loadData() {
            const loadingState = document.getElementById('loading-state');
            const noDataState = document.getElementById('no-data-state');
            const summaryGrid = document.getElementById('summary-grid');

            loadingState.style.display = 'block';
            noDataState.style.display = 'none';
            summaryGrid.innerHTML = '';

            let report = null;
            try {
                // 1) 独立打开时（本页即顶层）：直接通过 pywebview API 加载
                if (window.pywebview && window.pywebview.api) {
                    report = await window.pywebview.api.get_auction_diagnosis();
                }
                // 2) 嵌入 GUI 主页面时：请求父页面代为获取
                if (!report) report = await requestReportFromParent();
            } catch (error) {
                console.error('API 加载失败:', error);
                report = null;
            }

            // 3) 均失败时降级：从本地 JSON 加载
            if (!report || !report.holdings_diagnosis) {
                try {
                    const today = new Date().toISOString().split('T')[0];
                    const response = await fetch(`../t_io/preopen/auction_diagnosis_${today}.json`);
                    if (response.ok) report = await response.json();
                } catch (error) {
                    console.error('本地 JSON 加载失败:', error);
                }
            }

            loadingState.style.display = 'none';

            if (report && report.holdings_diagnosis && report.holdings_diagnosis.length > 0) {
                buildSummaryCards(report);
                buildIndexCards(report);
                buildHoldingCards(report.holdings_diagnosis);
                buildRiskAlerts(report);
            } else {
                noDataState.style.display = 'block';
            }
        }

        // 初始加载 + 定时刷新（30秒）
        loadData();
        setInterval(loadData, 30000);
    </script>
</body>
</html>
