<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>集合竞价诊断看板 - 做T猎手预警</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1e88e5;
            --success: #43a047;
            --danger: #e53935;
            --warning: #fb8c00;
            --info: #00acc1;
            --secondary: #90a4ae;
            --bg-dark: #0d1117;
            --bg-card: #161b22;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --border: #30363d;
            --accent-up: #28a745;
            --accent-down: #dc3545;
            --accent-neutral: #6c757d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #0a0f14 100%);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }

        /* ============ 头部标题 ============ */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-title h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-subtitle {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .header-time {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* ============ 策略摘要卡片 ============ */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }

        .summary-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .summary-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, currentColor, transparent);
        }

        .summary-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(30, 136, 229, 0.1);
        }

        .summary-card.up .summary-card::before {
            background: linear-gradient(90deg, var(--accent-up), transparent);
        }

        .summary-card.down .summary-card::before {
            background: linear-gradient(90deg, var(--accent-down), transparent);
        }

        .summary-card.neutral .summary-card::before {
            background: linear-gradient(90deg, var(--accent-neutral), transparent);
        }

        .summary-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .summary-value {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .summary-card.up .summary-value {
            color: var(--accent-up);
        }

        .summary-card.down .summary-value {
            color: var(--accent-down);
        }

        .summary-card.neutral .summary-value {
            color: var(--accent-neutral);
        }

        .summary-subtitle {
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* ============ 大盘竞价分析 ============ */
        .section {
            margin-bottom: 32px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 16px;
            background: var(--primary);
            border-radius: 2px;
        }

        .index-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .index-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 16px;
            text-align: center;
        }

        .index-card-name {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .index-card-gap {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .index-card-gap.up {
            color: var(--accent-up);
        }

        .index-card-gap.down {
            color: var(--accent-down);
        }

        .index-card-level {
            font-size: 11px;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
        }

        .market-mood {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .mood-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .mood-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--info);
        }

        /* ============ 持仓竞价诊断 ============ */
        .holdings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .holding-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 18px;
            transition: all 0.3s ease;
            position: relative;
        }

        .holding-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            border-radius: 8px 8px 0 0;
        }

        .holding-card.bullish::before {
            background: linear-gradient(90deg, var(--accent-up), rgba(40, 167, 69, 0.3));
        }

        .holding-card.bearish::before {
            background: linear-gradient(90deg, var(--accent-down), rgba(220, 53, 69, 0.3));
        }

        .holding-card.neutral::before {
            background: linear-gradient(90deg, var(--accent-neutral), rgba(108, 117, 125, 0.3));
        }

        .holding-card:hover {
            border-color: var(--primary);
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(30, 136, 229, 0.15);
        }

        .holding-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .holding-code {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .holding-name {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
            margin: 4px 0 8px 0;
        }

        .holding-gap {
            font-size: 20px;
            font-weight: 700;
        }

        .holding-gap.up {
            color: var(--accent-up);
        }

        .holding-gap.down {
            color: var(--accent-down);
        }

        .holding-gap.flat {
            color: var(--accent-neutral);
        }

        .holding-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .holding-trend {
            background: rgba(30, 136, 229, 0.1);
            color: var(--info);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .holding-linkage {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 12px;
            font-size: 12px;
        }

        .linkage-risk {
            font-weight: 700;
            margin-bottom: 4px;
        }

        .linkage-risk.high-risk {
            color: var(--accent-down);
        }

        .linkage-risk.opportunity {
            color: var(--accent-up);
        }

        .linkage-detail {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .holding-suggestion {
            background: linear-gradient(135deg, rgba(30, 136, 229, 0.1), rgba(0, 172, 193, 0.05));
            border-left: 3px solid var(--info);
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .suggestion-title {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .suggestion-text {
            font-size: 13px;
            font-weight: 600;
            color: var(--info);
            line-height: 1.5;
        }

        .holding-confidence {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
        }

        .confidence-label {
            color: var(--text-secondary);
        }

        .confidence-value {
            background: rgba(30, 136, 229, 0.2);
            color: var(--info);
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        /* ============ 风险提示 ============ */
        .risk-section {
            margin-top: 28px;
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 16px;
        }

        .risk-alert {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .risk-alert:last-child {
            margin-bottom: 0;
        }

        .risk-icon {
            font-size: 18px;
            flex-shrink: 0;
        }

        /* ============ 无数据提示 ============ */
        .no-data {
            background: var(--bg-card);
            border: 1px dashed var(--border);
            border-radius: 8px;
            padding: 48px 20px;
            text-align: center;
            color: var(--text-secondary);
        }

        .no-data-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .no-data-text {
            font-size: 14px;
            margin-bottom: 8px;
        }

        .no-data-hint {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* ============ 加载动画 ============ */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid var(--border);
            border-top-color: var(--info);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ============ 响应式设计 ============ */
        @media (max-width: 768px) {
            .container {
                padding: 16px;
            }

            .header-title h1 {
                font-size: 20px;
            }

            .summary-grid {
                grid-template-columns: 1fr;
            }

            .holdings-grid {
                grid-template-columns: 1fr;
            }

            .holding-card {
                padding: 14px;
            }
        }

        /* ============ 动画和过渡 ============ */
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .pulse {
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <div class="header-title">
                <h1>📊 竞价诊断</h1>
                <div>
                    <div class="header-subtitle">做T猎手决策看板</div>
                    <div class="header-time" id="current-time">正在加载...</div>
                </div>
            </div>
        </div>

        <!-- 加载状态 -->
        <div id="loading-state" style="text-align: center; padding: 48px; display: none;">
            <div class="loading" style="margin: 0 auto 16px;"></div>
            <p style="color: var(--text-secondary);">正在分析竞价数据...</p>
        </div>

        <!-- 主内容 -->
        <div id="main-content" style="display: none;">
            <!-- 策略摘要 -->
            <div class="summary-grid" id="summary-grid">
                <!-- 动态生成 -->
            </div>

            <!-- 大盘竞价分析 -->
            <div class="section" id="index-section" style="display: none;">
                <div class="section-title">🌐 大盘竞价</div>
                <div class="index-cards" id="index-cards">
                    <!-- 动态生成 -->
                </div>
                <div class="market-mood" id="market-mood">
                    <div class="mood-label">市场情绪</div>
                    <div class="mood-value" id="mood-value">中性</div>
                </div>
            </div>

            <!-- 持仓竞价诊断 -->
            <div class="section">
                <div class="section-title">📈 持仓竞价一览</div>
                <div class="holdings-grid" id="holdings-grid">
                    <!-- 动态生成 -->
                </div>
            </div>

            <!-- 风险提示 -->
            <div class="risk-section" id="risk-section" style="display: none;">
                <div class="section-title">⚡ 风险提示</div>
                <div id="risk-alerts-container">
                    <!-- 动态生成 -->
                </div>
            </div>
        </div>

        <!-- 无数据提示 -->
        <div id="no-data-state" style="display: none;">
            <div class="no-data">
                <div class="no-data-icon">📭</div>
                <div class="no-data-text">暂无竞价诊断数据</div>
                <div class="no-data-hint">请等待 9:25 后获取今日竞价信息</div>
            </div>
        </div>
    </div>

    <script>
        const BASE_URL = '/api';

        // 格式化时间
        function formatTime(date) {
            const h = String(date.getHours()).padStart(2, '0');
            const m = String(date.getMinutes()).padStart(2, '0');
            const s = String(date.getSeconds()).padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        // 实时时钟
        function updateClock() {
            const now = new Date();
            document.getElementById('current-time').textContent = formatTime(now);
        }
        updateClock();
        setInterval(updateClock, 1000);

        // 颜色映射
        function getGapClass(gap) {
            if (gap > 0.5) return 'up';
            if (gap < -0.5) return 'down';
            return 'flat';
        }

        function getGapSign(gap) {
            return gap > 0 ? `+${gap.toFixed(2)}%` : `${gap.toFixed(2)}%`;
        }

        // 构建摘要卡片
        function buildSummaryCards(report) {
            const summaryGrid = document.getElementById('summary-grid');
            summaryGrid.innerHTML = '';

            const cards = [
                {
                    label: '高开',
                    value: report.bullish_count,
                    class: report.bullish_count > 0 ? 'up' : 'neutral'
                },
                {
                    label: '平开',
                    value: report.neutral_count,
                    class: 'neutral'
                },
                {
                    label: '低开',
                    value: report.bearish_count,
                    class: report.bearish_count > 0 ? 'down' : 'neutral'
                },
                {
                    label: '策略建议',
                    value: report.suggested_action,
                    class: report.suggested_action === '进攻' ? 'up' : (report.suggested_action === '回避' ? 'down' : 'neutral')
                }
            ];

            cards.forEach(card => {
                const html = `
                    <div class="summary-card ${card.class} fade-in">
                        <div class="summary-label">${card.label}</div>
                        <div class="summary-value">${card.value}</div>
                    </div>
                `;
                summaryGrid.insertAdjacentHTML('beforeend', html);
            });
        }

        // 构建持仓诊断卡片
        function buildHoldingCards(holdings) {
            const grid = document.getElementById('holdings-grid');
            grid.innerHTML = '';

            if (!holdings || holdings.length === 0) {
                grid.innerHTML = '<div class="no-data" style="grid-column: 1/-1;"><div class="no-data-text">暂无持仓数据</div></div>';
                return;
            }

            holdings.forEach((holding, idx) => {
                const cardClass = holding.gap_pct > 0.5 ? 'bullish' : (holding.gap_pct < -0.5 ? 'bearish' : 'neutral');
                const gapClass = getGapClass(holding.gap_pct);

                const html = `
                    <div class="holding-card ${cardClass} fade-in">
                        <div class="holding-header">
                            <div>
                                <div class="holding-code">${holding.code}</div>
                                <div class="holding-name">${holding.name}</div>
                            </div>
                            <div class="holding-gap ${gapClass}">${getGapSign(holding.gap_pct)}</div>
                        </div>

                        <div class="holding-meta">
                            <span>${holding.gap_level}</span>
                            <span class="holding-trend">${holding.trend_shape}</span>
                        </div>

                        <div class="holding-linkage">
                            <div class="linkage-risk ${holding.risk_tag.includes('高危') ? 'high-risk' : (holding.risk_tag.includes('机会') ? 'opportunity' : '')}">
                                ${holding.risk_tag} ${holding.linkage_label}
                            </div>
                            <div class="linkage-detail">
                                ${holding.yesterday_label === '横盘' ? '昨日横盘' : `昨日${holding.yesterday_label}(${holding.yesterday_change_pct.toFixed(2)}%)`}
                            </div>
                        </div>

                        <div class="holding-suggestion">
                            <div class="suggestion-title">做T建议</div>
                            <div class="suggestion-text">${holding.suggestion}</div>
                        </div>

                        <div class="holding-confidence">
                            <span class="confidence-label">置信度</span>
                            <span class="confidence-value">${holding.confidence}</span>
                        </div>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', html);
            });
        }

        // 构建风险提示
        function buildRiskAlerts(report) {
            const container = document.getElementById('risk-alerts-container');
            const section = document.getElementById('risk-section');

            if (!report.risk_alerts || report.risk_alerts.length === 0) {
                section.style.display = 'none';
                return;
            }

            section.style.display = 'block';
            container.innerHTML = '';

            report.risk_alerts.forEach(alert => {
                const icon = alert.includes('⚠️') ? '⚠️' : '💪';
                const html = `
                    <div class="risk-alert fade-in">
                        <span class="risk-icon">${icon}</span>
                        <span>${alert}</span>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', html);
            });
        }

        // 加载并展示数据
        async function loadDiagnosisData() {
            const loadingState = document.getElementById('loading-state');
            const mainContent = document.getElementById('main-content');
            const noDataState = document.getElementById('no-data-state');

            loadingState.style.display = 'block';
            mainContent.style.display = 'none';
            noDataState.style.display = 'none';

            try {
                // 尝试通过 pywebview API 加载
                if (window.pywebview && window.pywebview.api) {
                    const report = await window.pywebview.api.get_auction_diagnosis();
                    if (report && report.holdings_diagnosis && report.holdings_diagnosis.length > 0) {
                        buildSummaryCards(report);
                        buildHoldingCards(report.holdings_diagnosis);
                        buildRiskAlerts(report);
                        loadingState.style.display = 'none';
                        mainContent.style.display = 'block';
                        return;
                    }
                } else {
                    // 降级方案：从本地 JSON 加载
                    const today = new Date().toISOString().split('T')[0];
                    const response = await fetch(`../t_io/preopen/auction_diagnosis_${today}.json`);
                    if (response.ok) {
                        const report = await response.json();
                        if (report.holdings_diagnosis && report.holdings_diagnosis.length > 0) {
                            buildSummaryCards(report);
                            buildHoldingCards(report.holdings_diagnosis);
                            buildRiskAlerts(report);
                            loadingState.style.display = 'none';
                            mainContent.style.display = 'block';
                            return;
                        }
                    }
                }

                // 无数据
                loadingState.style.display = 'none';
                noDataState.style.display = 'block';
            } catch (error) {
                console.error('加载诊断数据失败:', error);
                loadingState.style.display = 'none';
                noDataState.style.display = 'block';
            }
        }

        // 初始加载 + 定时刷新（每 30 秒）
        loadDiagnosisData();
        setInterval(loadDiagnosisData, 30000);
    </script>
</body>
</html>
